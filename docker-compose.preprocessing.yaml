version: '3.8'

services:
  preprocessing:
    build:
      context: .
      dockerfile: docker/Dockerfile.preprocessing
    image: hunyuan3d-preprocessing:latest
    container_name: hunyuan3d-preprocessing
    volumes:
      # Mount the tools directory
      - ./hy3dshape/tools:/workspace/tools
      # Mount your input data directory (customize this path)
      - ./src/preprocessing/data/raw:/workspace/data/raw
      # Mount your output data directory (customize this path)
      - ./src/preprocessing/data/preprocessed:/workspace/data/preprocessed
    environment:
      - OPENCV_IO_ENABLE_OPENEXR=1
      - BLENDER_PATH=/opt/blender/blender
    working_dir: /workspace/tools
    stdin_open: true
    tty: true
    command: /bin/bash
